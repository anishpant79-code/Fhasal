
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#FFF7A8"/>
      <stop offset="65%" stop-color="#FFD83D"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </radialGradient>

    <linearGradient id="sunRay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <filter id="sunShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Soft glow -->
  <circle cx="100" cy="100" r="65"
          fill="#FFC928" opacity="0.25"
          filter="url(#sunShadow)"/>

  <!-- Curved sun rays -->
  <g fill="url(#sunRay)">
    <path d="M100 10 C111 23 111 34 100 44 C89 34 89 23 100 10Z"/>
    <path d="M100 190 C89 177 89 166 100 156 C111 166 111 177 100 190Z"/>

    <path d="M10 100 C23 89 34 89 44 100 C34 111 23 111 10 100Z"/>
    <path d="M190 100 C177 111 166 111 156 100 C166 89 177 89 190 100Z"/>

    <path d="M36 36 C53 40 61 49 60 63 C46 61 40 53 36 36Z"/>
    <path d="M164 36 C160 53 151 61 137 60 C139 46 147 40 164 36Z"/>

    <path d="M36 164 C40 147 49 139 63 140 C61 154 53 160 36 164Z"/>
    <path d="M164 164 C147 160 139 151 140 137 C154 139 160 147 164 164Z"/>

    <path d="M58 13 C72 25 76 37 69 49 C57 39 54 27 58 13Z"/>
    <path d="M142 13 C146 27 143 39 131 49 C124 37 128 25 142 13Z"/>

    <path d="M58 187 C54 173 57 161 69 151 C76 163 72 175 58 187Z"/>
    <path d="M142 187 C128 175 124 163 131 151 C143 161 146 173 142 187Z"/>
  </g>

  <!-- Sun body -->
  <circle cx="100" cy="100" r="49"
          fill="url(#sunGlow)"
          stroke="#FFB91D"
          stroke-width="2"/>

  <!-- Highlight -->
  <ellipse cx="82" cy="79" rx="15" ry="7"
           fill="#FFF9CF" opacity="0.45"
           transform="rotate(-35 82 79)"/>
</svg>
